name: Build & Release

on:
  push:
    branches:
      - main
      - 't3/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.ver.outputs.version }}"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/czhax-linux-arm64 ./cmd/czhax
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/czhax-linux-armv7 ./cmd/czhax
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/czhax-linux-amd64 ./cmd/czhax
          (cd dist && sha256sum czhax-linux-* > checksums.txt)
          ls -lh dist/

      - name: Fetch the vendor CYW43439 firmware
        run: |
          set -euo pipefail
          mkdir -p fw-in
          # Raspberry Pi's firmware package, pinned: the blob nexmon patches and
          # the one the board ships with.
          curl -fsSL --retry 3 -o fw.deb \
            https://archive.raspberrypi.com/debian/pool/main/f/firmware-nonfree/firmware-brcm80211_20260519-1~bpo13+1+rpt2_all.deb
          dpkg-deb -x fw.deb fw-x
          cp fw-x/usr/lib/firmware/cypress/cyfmac43439-sdio.bin fw-in/
          cp fw-x/usr/lib/firmware/cypress/cyfmac43439-sdio.clm_blob fw-in/
          echo "09e289c00944d8a50cc38760f9fc29b4  fw-in/cyfmac43439-sdio.bin" | md5sum -c -

      - name: Build the nexmon firmware
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 zlib1g:i386 gawk bison flex qpdf xxd zlib1g-dev
          NEXMON_MONITOR=1 ./firmware/nexmon/build-firmware.sh \
            --fw fw-in/cyfmac43439-sdio.bin \
            --clm fw-in/cyfmac43439-sdio.clm_blob \
            --out dist/czhax-firmware-bcm43439a0-7.95.75.bin \
            --bundle-out dist/czhax-firmware-bcm43439a0-7.95.75.json
          cp fw-x/usr/share/doc/firmware-brcm80211/copyright dist/firmware-LICENCE.txt
          (cd dist && sha256sum czhax-firmware-* >> checksums.txt)
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: czhax-binaries
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: czhax-binaries
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/czhax-linux-arm64
            dist/czhax-linux-armv7
            dist/czhax-linux-amd64
            dist/czhax-firmware-bcm43439a0-7.95.75.bin
            dist/czhax-firmware-bcm43439a0-7.95.75.json
            dist/firmware-LICENCE.txt
            dist/checksums.txt
